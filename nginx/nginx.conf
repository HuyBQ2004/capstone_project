# Reverse proxy — Cloudflare Tunnel (hoặc trình duyệt lúc test local) vào đây trước, không expose
# backend/frontend ra ngoài trực tiếp. server_name "_" — nhận mọi Host header (domain thật hay
# localhost đều vào được), TLS do Cloudflare xử lý ở phía trước (Tunnel), Nginx chỉ cần HTTP.
client_max_body_size 15m;   # BR/D10-BIS: hồ sơ y tế/ảnh khuôn mặt tối đa 10MB, dư biên an toàn.

upstream frontend {
    server frontend:3000;
}

upstream backend {
    server backend:8080;
}

server {
    listen 80;
    server_name _;

    # Trợ lý AI — prefix DÀI HƠN nên nginx chọn location này trước /api/v1/ (không phụ thuộc thứ tự).
    #
    # Vì sao tách riêng: một lượt sinh của rag-service mất 11–60s tuỳ độ dài prompt (đo 09/08/2026:
    # câu hỏi ngắn ~11.5s, prompt gợi ý thực đơn kèm danh mục nguyên liệu > 60s). Với
    # proxy_read_timeout mặc định 60s, nút "Gợi ý bằng AI" ở màn thực đơn trả về 504 HTML của nginx
    # — backend vẫn sinh xong và ghi log thành công, nên nhìn từ log tưởng không có lỗi.
    # 180s: đủ biên cho prompt dài nhất, vẫn ngắn hơn thời gian người dùng bỏ cuộc.
    location /api/v1/ai/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Nhập hàng loạt từ file (13/08/2026) — CHẬM theo khối lượng, không phải do hỏng.
    #
    # `POST /students/import/{id}/commit` chạy cả lô trong MỘT transaction (ADR-M03-6,
    # all-or-nothing) và mỗi hàng còn sinh mã + tạo tài khoản phụ huynh (băm BCrypt ~100ms).
    # Đo thật: nhập 100 học sinh vượt xa proxy_read_timeout mặc định 60s của location
    # `/api/v1/` bên dưới. Khớp bằng regex (`~`) nên được ưu tiên hơn mọi prefix location —
    # nới đúng luồng import, phần API còn lại vẫn giữ 60s để hỏng thì báo sớm.
    #
    # ⚠️ Nới ở đây thôi là CHƯA ĐỦ: axios cũng có timeout riêng, xem `BULK_IMPORT_PATHS`
    # trong `Frontend/src/lib/api/client.ts` — hai đầu phải nới cùng nhau.
    location ~ ^/api/v1/.*/import(/|$) {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # API + file tĩnh do backend phục vụ trực tiếp (bỏ qua vòng qua Next.js rewrite).
    location /api/v1/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    # Google OAuth2 login (Spring Security OAuth2 Client, TDS §17 C5) — nút "Đăng nhập bằng
    # Google" của frontend điều hướng thẳng vào đây bằng path tương đối.
    location ~ ^/(oauth2/|login/oauth2/) {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    # Swagger/OpenAPI — chỉ nên mở khi cần debug, cân nhắc chặn ở Cloudflare Access lúc lên thật.
    location ~ ^/(swagger-ui|v3/api-docs) {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    # Chuông thông báo real-time (SockJS/STOMP, WebSocketConfig.java) — Upgrade/Connection BẮT
    # BUỘC set tường minh ở ĐÂY (khác location "/" dùng $http_upgrade chung cho Next.js HMR),
    # timeout dài hơn default 60s vì kết nối SockJS/STOMP giữ mở liên tục, không phải request rời.
    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Còn lại → Next.js (frontend tự SSR/route theo path nội bộ của nó).
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";   # dự phòng cho WebSocket sau này (Next.js HMR/RSC)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
