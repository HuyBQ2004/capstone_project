<p class="text-on-surface-variant mb-8 text-center font-body">Chào mừng bạn quay lại hệ thống SFMS</p>
<!-- Login Form -->
<form action="#" class="w-full space-y-6" method="POST">
<!-- Username/Email Field -->
<div class="relative">
<input class="peer w-full h-14 bg-transparent text-on-surface font-body border border-outline rounded-md px-4 pt-4 pb-1 focus:outline-none focus:border-primary focus:border-2 focus:ring-0 transition-colors placeholder-transparent" id="username" name="username" placeholder="Tên đăng nhập / Email" required="" type="text"/>
<label class="absolute left-4 top-4 text-on-surface-variant text-base cursor-text peer-focus:text-xs peer-focus:-translate-y-3 peer-focus:text-primary transition-all duration-200 label-font bg-surface-container-lowest px-1 peer-[:not(:placeholder-shown)]:text-xs peer-[:not(:placeholder-shown)]:-translate-y-3" for="username">
                    Tên đăng nhập / Email
                </label>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="relative">
<input class="peer w-full h-14 bg-transparent text-on-surface font-body border border-outline rounded-md pl-4 pr-12 pt-4 pb-1 focus:outline-none focus:border-primary focus:border-2 focus:ring-0 transition-colors placeholder-transparent" id="password" name="password" placeholder="Mật khẩu" required="" type="password"/>
<label class="absolute left-4 top-4 text-on-surface-variant text-base cursor-text peer-focus:text-xs peer-focus:-translate-y-3 peer-focus:text-primary transition-all duration-200 label-font bg-surface-container-lowest px-1 peer-[:not(:placeholder-shown)]:text-xs peer-[:not(:placeholder-shown)]:-translate-y-3" for="password">
                        Mật khẩu
                    </label>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary focus:outline-none transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="visibilityIcon">visibility_off</span>
</button>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end">
<a class="text-sm font-medium text-primary hover:text-primary-dim transition-colors label-font" href="#">
                        Quên mật khẩu?
                    </a>
</div>
</div>
<!-- Submit Button -->
<button class="w-full h-12 bg-primary hover:bg-primary-dim text-on-primary font-bold rounded-full transition-all shadow-md hover:shadow-lg active:scale-[0.98] flex items-center justify-center font-label" type="submit">
                Đăng nhập
            </button>
</form>
<!-- Sign Up Link -->
<div class="mt-8 text-center">
<p class="text-on-surface-variant font-body">
                Bạn chưa có tài khoản?

                    Đăng ký
                </a>
</p>
</div>
</main>
<!-- Bottom Nav Bar (Semantic Shell - Suppressed for Login Page) -->
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const visibilityIcon = document.getElementById('visibilityIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                visibilityIcon.textContent = 'visibility';
            } else {
                passwordInput.type = 'password';
                visibilityIcon.textContent = 'visibility_off';
            }
        }
    </script>
