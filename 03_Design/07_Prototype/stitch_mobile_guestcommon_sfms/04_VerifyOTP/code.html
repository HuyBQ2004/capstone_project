<body class="bg-background text-on-background font-body min-h-screen flex flex-col antialiased">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface flex items-center px-4 h-16 max-w-7xl mx-auto shadow-sm">
<button aria-label="Quay lại" class="p-2 hover:bg-surface-container-high transition-colors rounded-full text-on-surface-variant active:scale-95 transition-transform">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<h1 class="ml-4 font-headline font-bold text-headline-sm text-primary">Xác thực OTP</h1>
</header>
<!-- Main Content -->
<main class="flex-grow flex flex-col items-center pt-24 px-6 pb-12 w-full max-w-md mx-auto">
<!-- Header Text -->
<div class="text-center mb-8">
<p class="text-on-surface-variant text-body-lg">
                Chúng tôi đã gửi mã xác thực gồm 6 chữ số đến email của bạn
            </p>
</div>
<!-- OTP Inputs -->
<div class="flex justify-between w-full gap-2 mb-8">
<input class="w-12 h-14 text-center text-2xl font-semibold bg-surface-container-lowest border-2 border-outline-variant rounded-lg focus:border-primary focus:ring-2 focus:ring-primary-container outline-none transition-all text-on-surface" maxlength="1" type="text"/>
<input class="w-12 h-14 text-center text-2xl font-semibold bg-surface-container-lowest border-2 border-outline-variant rounded-lg focus:border-primary focus:ring-2 focus:ring-primary-container outline-none transition-all text-on-surface" maxlength="1" type="text"/>
<input class="w-12 h-14 text-center text-2xl font-semibold bg-surface-container-lowest border-2 border-outline-variant rounded-lg focus:border-primary focus:ring-2 focus:ring-primary-container outline-none transition-all text-on-surface" maxlength="1" type="text"/>
<input class="w-12 h-14 text-center text-2xl font-semibold bg-surface-container-lowest border-2 border-outline-variant rounded-lg focus:border-primary focus:ring-2 focus:ring-primary-container outline-none transition-all text-on-surface" maxlength="1" type="text"/>
<input class="w-12 h-14 text-center text-2xl font-semibold bg-surface-container-lowest border-2 border-outline-variant rounded-lg focus:border-primary focus:ring-2 focus:ring-primary-container outline-none transition-all text-on-surface" maxlength="1" type="text"/>
<input class="w-12 h-14 text-center text-2xl font-semibold bg-surface-container-lowest border-2 border-outline-variant rounded-lg focus:border-primary focus:ring-2 focus:ring-primary-container outline-none transition-all text-on-surface" maxlength="1" type="text"/>
</div>
<!-- Timer -->
<div class="text-center mb-8">
<p class="text-on-surface-variant text-body-md font-medium">
                Gửi lại mã sau <span class="text-primary font-semibold" id="countdown">02:00</span>
</p>
</div>
<!-- Verify Button -->
<button class="w-full bg-primary hover:bg-primary-dim text-on-primary font-label font-bold py-4 px-6 rounded-full shadow-md active:scale-[0.98] transition-all mb-6">
            Xác minh mã
        </button>
<!-- Resend Button -->
<button class="text-outline hover:text-outline-variant font-label font-medium py-2 px-4 rounded-full transition-colors opacity-50 cursor-not-allowed" disabled="">
            Gửi lại mã OTP
        </button>
</main>
<script>
        // Simple auto-focus for OTP inputs
        const inputs = document.querySelectorAll('input[type="text"]');
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value.length === 0 && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });
    </script>
