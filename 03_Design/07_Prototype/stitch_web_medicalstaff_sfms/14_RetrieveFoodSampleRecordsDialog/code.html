<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Truy xuất mẫu thực phẩm điều tra Web</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container": "#e6eeff",
                        "primary-fixed-dim": "#81d1f0",
                        "tertiary-container": "#686b6d",
                        "on-primary-fixed": "#001f29",
                        "on-tertiary": "#ffffff",
                        "primary-container": "#0e7490",
                        "error-container": "#ffdad6",
                        "on-secondary-fixed": "#0b1c30",
                        "background": "#f8f9ff",
                        "on-tertiary-fixed": "#191c1e",
                        "surface-dim": "#d0dbed",
                        "on-secondary-fixed-variant": "#38485d",
                        "on-primary-fixed-variant": "#004d62",
                        "outline": "#6f787d",
                        "on-secondary-container": "#54647a",
                        "tertiary-fixed": "#e0e3e5",
                        "surface": "#f8f9ff",
                        "surface-bright": "#f8f9ff",
                        "on-tertiary-fixed-variant": "#444749",
                        "secondary-fixed-dim": "#b7c8e1",
                        "on-surface-variant": "#3f484c",
                        "on-background": "#121c2a",
                        "surface-container-low": "#eff4ff",
                        "secondary-fixed": "#d3e4fe",
                        "inverse-on-surface": "#eaf1ff",
                        "outline-variant": "#bec8cd",
                        "secondary": "#505f76",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-high": "#dee9fc",
                        "secondary-container": "#d0e1fb",
                        "surface-variant": "#d9e3f6",
                        "primary-fixed": "#b9eaff",
                        "tertiary-fixed-dim": "#c4c7c9",
                        "surface-container-highest": "#d9e3f6",
                        "on-surface": "#121c2a",
                        "on-error-container": "#93000a",
                        "error": "#ba1a1a",
                        "tertiary": "#505355",
                        "on-tertiary-container": "#eaecee",
                        "primary": "#005a71",
                        "on-secondary": "#ffffff",
                        "inverse-primary": "#81d1f0",
                        "on-primary": "#ffffff",
                        "on-error": "#ffffff",
                        "surface-tint": "#006781",
                        "on-primary-container": "#d3f1ff",
                        "inverse-surface": "#27313f"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "topbar-height": "64px",
                        "sidebar-width": "280px",
                        "gutter": "16px",
                        "section-gap": "32px",
                        "container-padding": "24px"
                    },
                    "fontFamily": {
                        "h3": ["Be Vietnam Pro"],
                        "h2": ["Be Vietnam Pro"],
                        "h1": ["Be Vietnam Pro"],
                        "label-sm": ["Be Vietnam Pro"],
                        "label-md": ["Be Vietnam Pro"],
                        "body-sm": ["Be Vietnam Pro"],
                        "body-lg": ["Be Vietnam Pro"]
                    },
                    "fontSize": {
                        "h3": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "h2": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "h1": ["30px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "600" }],
                        "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Be Vietnam Pro', sans-serif; }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-4">
<!-- Backdrop -->
<div class="fixed inset-0 bg-on-background/40 backdrop-blur-sm z-40 transition-opacity"></div>
<!-- Modal Dialog -->
<div aria-labelledby="modal-title" aria-modal="true" class="relative z-50 w-full max-w-2xl bg-surface-container-lowest rounded-xl shadow-lg border border-outline-variant flex flex-col max-h-[921px] overflow-hidden" role="dialog">
<!-- Header -->
<div class="flex items-center justify-between px-6 py-4 border-b border-outline-variant/50 bg-surface-container-low/50">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-primary-container/20 flex items-center justify-center text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">manage_search</span>
</div>
<div>
<h2 class="font-h3 text-h3 text-on-background" id="modal-title">Truy xuất mẫu thực phẩm điều tra</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-0.5">Vui lòng điền thông tin để phục vụ công tác truy xuất mẫu.</p>
</div>
</div>
<button aria-label="Đóng" class="text-on-surface-variant hover:text-on-background hover:bg-surface-variant p-2 rounded-full transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Body (Form) -->
<div class="px-6 py-6 overflow-y-auto flex-1">
<form class="space-y-6">
<!-- Date Range -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-background">Khoảng thời gian <span class="text-error">*</span></label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">calendar_month</span>
</div>
<input class="block w-full pl-10 pr-3 py-2 border border-outline-variant rounded-lg bg-surface-container-lowest focus:ring-2 focus:ring-primary/20 focus:border-primary font-body-sm text-body-sm text-on-background placeholder:text-outline-variant transition-shadow" placeholder="Chọn ngày bắt đầu - ngày kết thúc" type="text"/>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- Suspect Batch -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-background">Lô hàng nghi ngờ</label>
<input class="block w-full px-3 py-2 border border-outline-variant rounded-lg bg-surface-container-lowest focus:ring-2 focus:ring-primary/20 focus:border-primary font-body-sm text-body-sm text-on-background placeholder:text-outline-variant transition-shadow" placeholder="Nhập mã lô hàng" type="text"/>
</div>
<!-- Incident ID -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-background">Mã sự cố / Incident ID <span class="text-error">*</span></label>
<input class="block w-full px-3 py-2 border border-outline-variant rounded-lg bg-surface-container-lowest focus:ring-2 focus:ring-primary/20 focus:border-primary font-body-sm text-body-sm text-on-background placeholder:text-outline-variant transition-shadow" placeholder="VD: INC-2023-001" type="text"/>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- Authorized Person -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-background">Người ủy quyền <span class="text-error">*</span></label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">person</span>
</div>
<input class="block w-full pl-10 pr-3 py-2 border border-outline-variant rounded-lg bg-surface-container-lowest focus:ring-2 focus:ring-primary/20 focus:border-primary font-body-sm text-body-sm text-on-background placeholder:text-outline-variant transition-shadow" placeholder="Họ và tên" type="text"/>
</div>
</div>
<!-- Testing Lab -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-background">Lab kiểm nghiệm được chỉ định</label>
<div class="relative">
<select class="block w-full pl-3 pr-10 py-2 border border-outline-variant rounded-lg bg-surface-container-lowest focus:ring-2 focus:ring-primary/20 focus:border-primary font-body-sm text-body-sm text-on-background appearance-none transition-shadow">
<option disabled="" selected="" value="">Chọn cơ sở xét nghiệm...</option>
<option value="lab-1">Viện Kiểm nghiệm An toàn vệ sinh thực phẩm</option>
<option value="lab-2">Trung tâm Y tế dự phòng</option>
<option value="lab-3">Phòng xét nghiệm nội bộ SFMS</option>
</select>
<div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">expand_more</span>
</div>
</div>
</div>
</div>
<!-- Notice -->
<div class="bg-surface-variant/50 p-4 rounded-lg flex gap-3 border border-outline-variant/30 mt-4">
<span class="material-symbols-outlined text-tertiary-container mt-0.5">info</span>
<div>
<h4 class="font-label-md text-label-md text-on-background">Lưu ý quan trọng</h4>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1">Hành động khóa mẫu này sẽ lưu vết vào hệ thống và không thể hoàn tác. Biên nhận sẽ được tạo tự động sau khi xác nhận.</p>
</div>
</div>
</form>
</div>
<!-- Footer -->
<div class="px-6 py-4 border-t border-outline-variant/50 bg-surface-container-low/30 flex items-center justify-end gap-3">
<button class="px-5 py-2.5 rounded-lg border border-outline font-label-md text-label-md text-on-surface hover:bg-surface-variant transition-colors" type="button">
                Hủy
            </button>
<button class="px-5 py-2.5 rounded-lg bg-[#5e35b1] hover:bg-[#512da8] text-white font-label-md text-label-md flex items-center gap-2 shadow-sm transition-all active:scale-95" type="button">
<span class="material-symbols-outlined text-[18px]">lock</span>
                Khóa mẫu &amp; Xuất biên nhận
            </button>
</div>
</div>
</body></html>
