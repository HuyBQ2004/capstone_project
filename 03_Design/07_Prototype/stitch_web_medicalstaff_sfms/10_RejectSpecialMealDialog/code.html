<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>

<body class="bg-background text-on-background font-body-sm antialiased h-screen w-full flex items-center justify-center overflow-hidden relative">
<!-- Modal Overlay -->
<div aria-hidden="true" class="absolute inset-0 bg-on-background/40 backdrop-blur-sm z-40 transition-opacity"></div>
<!-- Modal Dialog -->
<div class="relative z-50 w-full max-w-lg bg-surface-container-lowest rounded-lg shadow-lg border border-outline-variant flex flex-col transform transition-all duration-300 scale-100">
<!-- Header -->
<div class="flex flex-col space-y-1.5 p-6 border-b border-outline-variant/50">
<h2 class="font-h3 text-h3 text-on-surface">Từ chối yêu cầu suất ăn</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">
                Vui lòng cung cấp lý do từ chối yêu cầu của học sinh <span class="font-semibold text-on-surface">Nguyễn Văn A</span>.
            </p>
</div>
<!-- Body -->
<div class="p-6">
<form class="space-y-4" id="rejectForm">
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface" for="reject-reason">
                        Lý do từ chối <span class="text-error">*</span>
</label>
<textarea class="w-full rounded-md border border-outline-variant bg-surface px-3 py-2 text-body-sm font-body-sm text-on-surface placeholder:text-outline focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-container/30 focus-visible:border-primary-container disabled:cursor-not-allowed disabled:opacity-50 resize-none transition-shadow" id="reject-reason" name="rejectReason" placeholder="Nhập lý do cụ thể để phụ huynh nắm thông tin..." required="" rows="4"></textarea>
</div>
</form>
</div>
<!-- Footer -->
<div class="flex items-center justify-end space-x-3 p-6 pt-2">
<button class="inline-flex items-center justify-center rounded-md font-label-md text-label-md h-9 px-4 py-2 border border-outline-variant bg-transparent text-on-surface hover:bg-surface-variant/50 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-container/30" onclick="console.log('Cancelled')" type="button">
                Hủy
            </button>
<button class="inline-flex items-center justify-center rounded-md font-label-md text-label-md h-9 px-4 py-2 bg-error text-on-error hover:bg-error/90 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-error/30 shadow-sm" form="rejectForm" type="submit">
                Xác nhận từ chối
            </button>
</div>
</div>
<script>
        document.getElementById('rejectForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const reason = document.getElementById('reject-reason').value;
            console.log('Submit rejection with reason:', reason);
            // Add visual feedback for submission
            const submitBtn = this.querySelector('button[type="submit"]');
            const originalText = submitBtn.textContent;
            submitBtn.disabled = true;
            submitBtn.textContent = 'Đang xử lý...';
            submitBtn.classList.add('opacity-80');
            
            setTimeout(() => {
                submitBtn.disabled = false;
                submitBtn.textContent = originalText;
                submitBtn.classList.remove('opacity-80');
                // Normally close modal here
            }, 1000);
        });
    </script>
</body></html>
