<!DOCTYPE html>

<html class="light" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Hộp thoại Đánh giá mức độ nghiêm trọng sự cố - Quản lý Y tế SFMS</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed": "#0b1c30",
                        "inverse-surface": "#27313f",
                        "on-secondary-fixed-variant": "#38485d",
                        "primary-container": "#0e7490",
                        "surface": "#f8f9ff",
                        "outline": "#6f787d",
                        "on-primary-container": "#d3f1ff",
                        "secondary": "#505f76",
                        "on-primary-fixed": "#001f29",
                        "on-tertiary-fixed": "#191c1e",
                        "surface-container-highest": "#d9e3f6",
                        "secondary-container": "#d0e1fb",
                        "on-error-container": "#93000a",
                        "inverse-primary": "#81d1f0",
                        "on-surface": "#121c2a",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-container": "#eaecee",
                        "surface-dim": "#d0dbed",
                        "inverse-on-surface": "#eaf1ff",
                        "on-secondary-container": "#54647a",
                        "outline-variant": "#bec8cd",
                        "background": "#f8f9ff",
                        "surface-container-high": "#dee9fc",
                        "on-tertiary-fixed-variant": "#444749",
                        "tertiary-fixed": "#e0e3e5",
                        "surface-bright": "#f8f9ff",
                        "tertiary-container": "#686b6d",
                        "primary": "#005a71",
                        "surface-container": "#e6eeff",
                        "on-error": "#ffffff",
                        "primary-fixed-dim": "#81d1f0",
                        "on-secondary": "#ffffff",
                        "tertiary-fixed-dim": "#c4c7c9",
                        "surface-variant": "#d9e3f6",
                        "on-primary-fixed-variant": "#004d62",
                        "on-background": "#121c2a",
                        "error-container": "#ffdad6",
                        "tertiary": "#505355",
                        "secondary-fixed-dim": "#b7c8e1",
                        "error": "#ba1a1a",
                        "surface-tint": "#006781",
                        "on-tertiary": "#ffffff",
                        "surface-container-low": "#eff4ff",
                        "primary-fixed": "#b9eaff",
                        "on-primary": "#ffffff",
                        "secondary-fixed": "#d3e4fe",
                        "on-surface-variant": "#3f484c"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sidebar-width": "280px",
                        "gutter": "16px",
                        "container-padding": "24px",
                        "topbar-height": "64px",
                        "section-gap": "32px"
                    },
                    "fontFamily": {
                        "body-lg": ["Be Vietnam Pro"],
                        "label-md": ["Be Vietnam Pro"],
                        "h2": ["Be Vietnam Pro"],
                        "label-sm": ["Be Vietnam Pro"],
                        "h1": ["Be Vietnam Pro"],
                        "h3": ["Be Vietnam Pro"],
                        "body-sm": ["Be Vietnam Pro"]
                    },
                    "fontSize": {
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "h2": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "600" }],
                        "h1": ["30px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "h3": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Be Vietnam Pro', sans-serif; }
    </style>
</head>
<body class="bg-background text-on-background antialiased h-screen w-screen overflow-hidden flex">
<!-- Mock Background Content (Details Screen) -->
<div class="flex-1 flex flex-col relative blur-sm transition-all duration-300">
<!-- Sidebar Shell Mock -->
<aside class="fixed left-0 top-0 h-screen w-[sidebar-width] border-r border-outline-variant bg-surface-container-lowest z-10 flex flex-col p-gutter shadow-sm">
<div class="mb-section-gap px-4">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-lg bg-primary-container flex items-center justify-center text-on-primary-container">
<span class="material-symbols-outlined" data-icon="local_hospital">local_hospital</span>
</div>
<div>
<h1 class="font-h2 text-h2 font-bold text-primary">Hệ thống SFMS</h1>
<p class="font-label-sm text-label-sm text-on-surface-variant">Quản lý Y tế</p>
</div>
</div>
</div>
<!-- Mock Nav Items -->
<nav class="flex-1 space-y-2">
<div class="flex items-center gap-3 px-4 py-3 text-on-secondary-container hover:bg-surface-container-high transition-colors rounded-lg cursor-pointer">
<span class="material-symbols-outlined" data-icon="dashboard">dashboard</span>
<span class="font-label-md text-label-md">Tổng quan</span>
</div>
<div class="flex items-center gap-3 px-4 py-3 text-primary bg-secondary-container font-semibold rounded-lg cursor-pointer">
<span class="material-symbols-outlined" data-icon="warning">warning</span>
<span class="font-label-md text-label-md">Sự cố y khoa</span>
</div>
</nav>
</aside>
<!-- Main Content Area Mock -->
<main class="ml-[sidebar-width] flex-1 flex flex-col">
<!-- TopNavBar Mock -->
<header class="h-[topbar-height] w-full bg-surface/80 backdrop-blur-md sticky top-0 border-b border-outline-variant shadow-sm z-20 flex justify-between items-center px-container-padding">
<div class="flex items-center gap-4">
<div class="flex space-x-6">
<span class="font-label-md text-label-md text-primary border-b-2 border-primary font-semibold pb-4 mt-4 cursor-pointer">Đang giải quyết</span>
</div>
</div>
</header>
<div class="p-container-padding flex-1 bg-surface-container-low overflow-y-auto">
<div class="max-w-4xl mx-auto bg-surface-container-lowest rounded-xl border border-outline-variant shadow-sm p-6">
<div class="h-8 bg-surface-container-highest rounded w-1/3 mb-4"></div>
<div class="h-4 bg-surface-container-highest rounded w-2/3 mb-8"></div>
<div class="grid grid-cols-2 gap-6">
<div class="h-32 bg-surface-container-highest rounded-lg"></div>
<div class="h-32 bg-surface-container-highest rounded-lg"></div>
</div>
</div>
</div>
</main>
</div>
<!-- Modal Overlay -->
<div class="fixed inset-0 bg-on-background/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
<!-- Modal Container -->
<div aria-labelledby="modal-title" aria-modal="true" class="bg-surface-container-lowest rounded-xl shadow-lg border border-outline-variant w-full max-w-lg overflow-hidden flex flex-col transform transition-all" role="dialog">
<!-- Modal Header -->
<div class="px-6 py-4 border-b border-outline-variant flex justify-between items-center bg-surface-container-lowest">
<h2 class="font-h3 text-h3 text-on-surface" id="modal-title">Đánh giá mức độ nghiêm trọng</h2>
<button aria-label="Close" class="text-on-surface-variant hover:text-on-surface transition-colors p-1 rounded-full hover:bg-surface-container-high">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<!-- Modal Body -->
<div class="p-6 overflow-y-auto space-y-6 bg-surface-container-lowest">
<!-- System Alert -->
<div class="flex items-start gap-3 p-4 bg-error-container/20 border border-error-container rounded-lg">
<span class="material-symbols-outlined text-error mt-0.5" data-icon="info" style="font-variation-settings: 'FILL' 1;">info</span>
<div>
<p class="font-label-md text-label-md text-on-surface font-semibold mb-1">Cảnh báo hệ thống</p>
<p class="font-body-sm text-body-sm text-on-surface-variant">Hệ thống đề xuất mức độ <span class="font-bold text-error">CAO</span> dựa trên 15 ca bệnh ghi nhận có liên quan đến sự cố này.</p>
</div>
</div>
<!-- Severity Selection (Radio Group) -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-3">Chọn mức độ nghiêm trọng</label>
<div class="space-y-3">
<!-- Option: Cao -->
<label class="relative flex cursor-pointer rounded-lg border border-outline-variant bg-surface-container-lowest p-4 focus:outline-none hover:bg-surface-container-high transition-colors has-[:checked]:border-error has-[:checked]:bg-error-container/10 has-[:checked]:ring-1 has-[:checked]:ring-error">
<div class="flex items-center h-5">
<input checked="" class="h-4 w-4 border-outline-variant text-error focus:ring-error focus:ring-offset-surface-container-lowest" name="severity" type="radio" value="high"/>
</div>
<div class="ml-3 flex flex-col">
<span class="block font-label-md text-label-md font-semibold text-error">Cao</span>
<span class="block font-body-sm text-body-sm text-on-surface-variant mt-1">Sự cố đe dọa tính mạng, yêu cầu can thiệp khẩn cấp ngay lập tức.</span>
</div>
</label>
<!-- Option: Trung bình -->
<label class="relative flex cursor-pointer rounded-lg border border-outline-variant bg-surface-container-lowest p-4 focus:outline-none hover:bg-surface-container-high transition-colors has-[:checked]:border-primary has-[:checked]:bg-primary-container/10 has-[:checked]:ring-1 has-[:checked]:ring-primary">
<div class="flex items-center h-5">
<input class="h-4 w-4 border-outline-variant text-primary focus:ring-primary focus:ring-offset-surface-container-lowest" name="severity" type="radio" value="medium"/>
</div>
<div class="ml-3 flex flex-col">
<span class="block font-label-md text-label-md font-semibold text-on-surface">Trung bình</span>
<span class="block font-body-sm text-body-sm text-on-surface-variant mt-1">Ảnh hưởng đến kết quả điều trị, cần theo dõi sát và xử lý trong ngày.</span>
</div>
</label>
<!-- Option: Thấp -->
<label class="relative flex cursor-pointer rounded-lg border border-outline-variant bg-surface-container-lowest p-4 focus:outline-none hover:bg-surface-container-high transition-colors has-[:checked]:border-primary has-[:checked]:bg-primary-container/10 has-[:checked]:ring-1 has-[:checked]:ring-primary">
<div class="flex items-center h-5">
<input class="h-4 w-4 border-outline-variant text-primary focus:ring-primary focus:ring-offset-surface-container-lowest" name="severity" type="radio" value="low"/>
</div>
<div class="ml-3 flex flex-col">
<span class="block font-label-md text-label-md font-semibold text-on-surface">Thấp</span>
<span class="block font-body-sm text-body-sm text-on-surface-variant mt-1">Không gây hại nghiêm trọng, cần ghi nhận và rút kinh nghiệm.</span>
</div>
</label>
</div>
</div>
<!-- Action Plan Textarea -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="action-plan">Kế hoạch khắc phục ban đầu</label>
<textarea class="block w-full rounded-lg border-outline-variant bg-surface-container-lowest font-body-sm text-body-sm text-on-surface shadow-sm focus:border-primary focus:ring-primary placeholder:text-on-surface-variant/50 resize-none transition-shadow" id="action-plan" name="action-plan" placeholder="Mô tả các hành động tức thời đã và sẽ thực hiện để giảm thiểu rủi ro..." rows="4"></textarea>
</div>
</div>
<!-- Modal Footer -->
<div class="px-6 py-4 bg-surface-container-lowest border-t border-outline-variant flex justify-end gap-3">
<button class="px-4 py-2 font-label-md text-label-md font-medium text-on-surface-variant bg-surface-container-lowest hover:bg-surface-container-high border border-outline-variant rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2" type="button">
                    Hủy
                </button>
<button class="px-4 py-2 font-label-md text-label-md font-medium text-on-error bg-error hover:bg-error/90 rounded-lg shadow-sm transition-colors focus:outline-none focus:ring-2 focus:ring-error focus:ring-offset-2 flex items-center gap-2" type="button">
<span class="material-symbols-outlined text-[18px]" data-icon="save">save</span>
                    Lưu đánh giá
                </button>
</div>
</div>
</div>
</body></html>
