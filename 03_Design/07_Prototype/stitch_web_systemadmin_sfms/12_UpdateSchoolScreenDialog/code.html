<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Cập nhật thông tin trường</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-primary": "#81d1f0",
                        "on-primary-fixed-variant": "#004d62",
                        "on-surface": "#181c1e",
                        "on-tertiary-container": "#ffe8d6",
                        "surface-tint": "#006781",
                        "primary-fixed-dim": "#81d1f0",
                        "on-secondary": "#ffffff",
                        "on-primary": "#ffffff",
                        "secondary-fixed-dim": "#b7c8e1",
                        "on-tertiary-fixed-variant": "#693c00",
                        "secondary": "#505f76",
                        "on-secondary-fixed-variant": "#38485d",
                        "on-secondary-fixed": "#0b1c30",
                        "on-error-container": "#93000a",
                        "on-tertiary": "#ffffff",
                        "surface-container-low": "#f1f4f6",
                        "inverse-surface": "#2d3133",
                        "primary-fixed": "#b9eaff",
                        "surface": "#f7fafc",
                        "tertiary-fixed": "#ffdcbd",
                        "on-secondary-container": "#54647a",
                        "secondary-fixed": "#d3e4fe",
                        "tertiary-fixed-dim": "#ffb86f",
                        "primary": "#005a71",
                        "surface-container-high": "#e6e8eb",
                        "on-surface-variant": "#3f484c",
                        "error-container": "#ffdad6",
                        "on-primary-fixed": "#001f29",
                        "tertiary": "#794602",
                        "tertiary-container": "#965e1c",
                        "surface-container": "#ebeef0",
                        "surface-dim": "#d7dadd",
                        "background": "#f7fafc",
                        "secondary-container": "#d0e1fb",
                        "surface-bright": "#f7fafc",
                        "error": "#ba1a1a",
                        "on-tertiary-fixed": "#2c1600",
                        "on-primary-container": "#d3f1ff",
                        "on-background": "#181c1e",
                        "outline": "#6f787d",
                        "inverse-on-surface": "#eef1f3",
                        "on-error": "#ffffff",
                        "surface-variant": "#e0e3e5",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-highest": "#e0e3e5",
                        "primary-container": "#0e7490",
                        "outline-variant": "#bec8cd"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "section-gap": "32px",
                        "base": "4px",
                        "container-margin": "24px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "label-sm": ["Be Vietnam Pro"],
                        "h1-mobile": ["Be Vietnam Pro"],
                        "h2": ["Be Vietnam Pro"],
                        "label-md": ["Be Vietnam Pro"],
                        "h3": ["Be Vietnam Pro"],
                        "body-md": ["Be Vietnam Pro"],
                        "body-lg": ["Be Vietnam Pro"],
                        "h1": ["Be Vietnam Pro"]
                    },
                    "fontSize": {
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "h1-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "h2": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "h3": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "h1": ["30px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Focus styles for inputs */
        input:focus, textarea:focus {
            outline: none;
            border-color: #0E7490;
            box-shadow: 0 0 0 2px rgba(14, 116, 144, 0.2);
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f4f6; 
        }
        ::-webkit-scrollbar-thumb {
            background: #bec8cd; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6f787d; 
        }
    </style>
</head>
<body class="bg-surface-container-high text-on-surface font-body-md min-h-screen flex items-center justify-center">
<!-- Modal Overlay -->
<div class="fixed inset-0 bg-on-surface/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
<!-- Modal Container -->
<div class="bg-surface-container-lowest rounded-xl shadow-lg w-full max-w-[800px] flex flex-col max-h-[921px] overflow-hidden border border-outline-variant">
<!-- Modal Header -->
<div class="flex items-center justify-between px-6 py-4 border-b border-outline-variant bg-surface-container-low">
<h2 class="font-h3 text-h3 text-on-surface">Cập nhật thông tin trường học</h2>
<button class="p-2 rounded-full hover:bg-surface-container-highest transition-colors text-on-surface-variant flex items-center justify-center">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Modal Body (Scrollable) -->
<div class="flex-1 overflow-y-auto p-6 space-y-6">
<!-- Basic Info Section -->
<div class="space-y-4">
<h3 class="font-label-md text-label-md text-primary font-semibold uppercase tracking-wide">Thông tin chung</h3>
<!-- Row 1 -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div class="space-y-1">
<label class="block font-label-md text-label-md text-on-surface-variant">Tên trường <span class="text-error">*</span></label>
<input class="w-full h-10 px-3 border border-outline-variant rounded-md bg-surface-container-lowest text-on-surface font-body-md" type="text" value="Trường THPT Chuyên Lê Hồng Phong"/>
</div>
<div class="space-y-1">
<label class="block font-label-md text-label-md text-on-surface-variant">Mã số thuế</label>
<input class="w-full h-10 px-3 border border-outline-variant rounded-md bg-surface-container-lowest text-on-surface font-body-md" type="text" value="0301234567"/>
</div>
</div>
<!-- Row 2 -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div class="space-y-1">
<label class="block font-label-md text-label-md text-on-surface-variant">Địa chỉ <span class="text-error">*</span></label>
<input class="w-full h-10 px-3 border border-outline-variant rounded-md bg-surface-container-lowest text-on-surface font-body-md" type="text" value="235 Nguyễn Văn Cừ, Phường 4, Quận 5, TP.HCM"/>
</div>
<div class="space-y-1">
<label class="block font-label-md text-label-md text-on-surface-variant">Email chính thức</label>
<input class="w-full h-10 px-3 border border-outline-variant rounded-md bg-surface-container-lowest text-on-surface font-body-md" type="email" value="contact@thpt-lehongphong.edu.vn"/>
</div>
</div>
<!-- Row 3 -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div class="space-y-1">
<label class="block font-label-md text-label-md text-on-surface-variant">Giờ hoạt động</label>
<div class="flex items-center space-x-2">
<div class="relative w-full">
<input class="w-full h-10 pl-3 pr-10 border border-outline-variant rounded-md bg-surface-container-lowest text-on-surface font-body-md" type="time" value="07:00"/>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline text-opacity-50 pointer-events-none">schedule</span>
</div>
<span class="text-on-surface-variant font-label-md">-</span>
<div class="relative w-full">
<input class="w-full h-10 pl-3 pr-10 border border-outline-variant rounded-md bg-surface-container-lowest text-on-surface font-body-md" type="time" value="17:00"/>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline text-opacity-50 pointer-events-none">schedule</span>
</div>
</div>
</div>
</div>
</div>
<hr class="border-t border-outline-variant"/>
<!-- GPS Configuration Section - Initial State (Disabled) -->
<div class="space-y-4" id="gps-section-initial">
<div class="flex items-center justify-between">
<h3 class="font-label-md text-label-md text-primary font-semibold uppercase tracking-wide">Cấu hình tọa độ GPS</h3>
<button class="h-9 px-4 border border-outline-variant text-primary rounded-md font-label-md text-label-md hover:bg-surface-container transition-colors flex items-center gap-2" onclick="toggleGpsEdit()">
<span class="material-symbols-outlined text-[18px]">lock_open</span>
                            Mở khóa tọa độ
                        </button>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div class="space-y-1 opacity-60">
<label class="block font-label-md text-label-md text-on-surface-variant">Vĩ độ</label>
<input class="w-full h-10 px-3 border border-outline-variant rounded-md bg-surface-container text-on-surface-variant font-body-md cursor-not-allowed" disabled="" type="text" value="10.762622"/>
</div>
<div class="space-y-1 opacity-60">
<label class="block font-label-md text-label-md text-on-surface-variant">Kinh độ</label>
<input class="w-full h-10 px-3 border border-outline-variant rounded-md bg-surface-container text-on-surface-variant font-body-md cursor-not-allowed" disabled="" type="text" value="106.682139"/>
</div>
</div>
</div>
<!-- GPS Configuration Section - Editing State (Hidden by default) -->
<div class="space-y-4 hidden bg-surface p-4 rounded-lg border border-outline-variant border-dashed" id="gps-section-editing">
<div class="flex items-center justify-between">
<h3 class="font-label-md text-label-md text-error font-semibold uppercase tracking-wide flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">warning</span>
                            Đang chỉnh sửa tọa độ GPS
                        </h3>
<button class="h-9 px-4 text-on-surface-variant hover:text-on-surface rounded-md font-label-md text-label-md hover:bg-surface-container transition-colors flex items-center gap-2" onclick="toggleGpsEdit()">
<span class="material-symbols-outlined text-[18px]">lock</span>
                            Khóa lại
                        </button>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div class="space-y-1">
<label class="block font-label-md text-label-md text-on-surface-variant">Vĩ độ <span class="text-error">*</span></label>
<input class="w-full h-10 px-3 border border-outline-variant rounded-md bg-surface-container-lowest text-on-surface font-body-md ring-1 ring-primary-container ring-opacity-20" type="text" value="10.762622"/>
</div>
<div class="space-y-1">
<label class="block font-label-md text-label-md text-on-surface-variant">Kinh độ <span class="text-error">*</span></label>
<input class="w-full h-10 px-3 border border-outline-variant rounded-md bg-surface-container-lowest text-on-surface font-body-md ring-1 ring-primary-container ring-opacity-20" type="text" value="106.682139"/>
</div>
</div>
<div class="space-y-1 mt-4">
<label class="block font-label-md text-label-md text-on-surface-variant">Lý do thay đổi tọa độ <span class="text-error">*</span></label>
<textarea class="w-full p-3 border border-outline-variant rounded-md bg-surface-container-lowest text-on-surface font-body-md resize-none" placeholder="Nhập lý do chi tiết cho việc thay đổi tọa độ..." rows="3"></textarea>
<p class="text-[11px] text-on-surface-variant mt-1">Thông tin này sẽ được lưu vào lịch sử hệ thống (Audit Log).</p>
</div>
</div>
</div>
<!-- Modal Footer -->
<div class="px-6 py-4 border-t border-outline-variant bg-surface flex justify-end gap-3">
<button class="h-10 px-6 border border-outline-variant text-on-surface-variant rounded-md font-label-md text-label-md hover:bg-surface-container transition-colors">
                    Hủy
                </button>
<button class="h-10 px-6 bg-primary-container text-on-primary rounded-md font-label-md text-label-md hover:bg-opacity-90 transition-opacity">
                    Lưu thông tin
                </button>
</div>
</div>
</div>
<script>
        function toggleGpsEdit() {
            const initialSection = document.getElementById('gps-section-initial');
            const editingSection = document.getElementById('gps-section-editing');
            
            if (initialSection.classList.contains('hidden')) {
                initialSection.classList.remove('hidden');
                editingSection.classList.add('hidden');
            } else {
                initialSection.classList.add('hidden');
                editingSection.classList.remove('hidden');
            }
        }
    </script>
</body></html>
