<!-- Scripts for simple interactions -->
<script>
        // Simple input focus styling script to ensure labels stay visible when input has content
        const inputs = document.querySelectorAll('input, textarea');
        inputs.forEach(input => {
            input.addEventListener('focus', (e) => {
                const label = e.target.previousElementSibling;
                if(label && label.tagName === 'LABEL' && !label.classList.contains('text-primary')) {
                    label.classList.remove('text-on-surface');
                    label.classList.add('text-primary');
                }
            });
            input.addEventListener('blur', (e) => {
                const label = e.target.previousElementSibling;
                if(label && label.tagName === 'LABEL') {
                    label.classList.add('text-on-surface');
                    label.classList.remove('text-primary');
                }
            });
        });
    </script>
