<body class="bg-surface-container-high min-h-screen flex items-center justify-center p-4">
<!-- Dialog Overlay -->
<div class="fixed inset-0 bg-on-surface/40 flex items-center justify-center p-margin-mobile z-50">
<!-- Dialog Surface -->
<div class="bg-surface-container-lowest rounded-xl shadow-lg w-full max-w-md overflow-hidden flex flex-col">
<!-- Dialog Header -->
<div class="px-lg pt-lg pb-4 flex flex-col gap-sm">
<div class="flex items-center justify-center w-12 h-12 rounded-full bg-error-container text-error mb-2">
<span class="material-symbols-outlined text-title-lg" data-icon="warning" data-weight="fill">warning</span>
</div>
<h2 class="font-title-lg text-title-lg text-on-surface">Từ chối yêu cầu suất ăn</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Từ chối yêu cầu suất ăn của học sinh <strong>Trần Minh Khôi</strong>?</p>
</div>
<!-- Dialog Content (Form) -->
<div class="px-lg pb-lg">
<div class="relative">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-xs" for="reject-reason">
                        Lý do từ chối <span class="text-error">*</span>
</label>
<textarea class="w-full border border-outline rounded-lg p-3 font-body-md text-body-md text-on-surface bg-transparent focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors resize-none placeholder:text-outline-variant" id="reject-reason" placeholder="Nhập lý do chi tiết..." required="" rows="4"></textarea>
</div>
</div>
<!-- Dialog Actions -->
<div class="px-lg py-4 bg-surface flex justify-end gap-sm border-t border-outline-variant/30">
<button class="px-4 py-2 font-label-lg text-label-lg text-primary hover:bg-primary/10 rounded-lg transition-colors flex items-center justify-center min-h-[48px]">
                    Hủy
                </button>
<button class="px-4 py-2 font-label-lg text-label-lg bg-error text-on-error hover:bg-error/90 rounded-lg transition-colors flex items-center justify-center min-h-[48px] shadow-sm">
                    Xác nhận từ chối
                </button>
</div>
</div>
