<body class="bg-surface text-on-surface h-screen flex flex-col relative overflow-hidden">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-surface dark:bg-surface-dim z-50">
<div class="flex items-center px-4 h-16 w-full max-w-7xl mx-auto">
<button class="p-2 -ml-2 rounded-full hover:bg-surface-container-high transition-colors active:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="ml-2 font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim">Đề xuất xử lý</h1>
</div>
</header>
<!-- Main Content -->
<main class="flex-1 overflow-y-auto px-4 py-6 max-w-2xl mx-auto w-full flex flex-col gap-6">
<!-- Summary Section -->
<section class="bg-surface-container-lowest rounded-xl p-4 border border-outline-variant/30 shadow-sm">
<h2 class="font-title-lg text-title-lg text-on-surface mb-4">Tóm tắt biên bản</h2>
<div class="space-y-4">
<div class="flex justify-between items-start border-b border-surface-variant pb-3">
<div class="text-on-surface-variant font-body-md text-body-md">Mã biên bản</div>
<div class="font-label-lg text-label-lg text-on-surface">BB-2023-0941</div>
</div>
<div class="flex justify-between items-start border-b border-surface-variant pb-3">
<div class="text-on-surface-variant font-body-md text-body-md">Đối tượng</div>
<div class="font-label-lg text-label-lg text-on-surface text-right">Nguyễn Văn A<br/><span class="font-body-md text-body-md text-on-surface-variant font-normal">Lớp 10A1</span></div>
</div>
<div class="flex justify-between items-start border-b border-surface-variant pb-3">
<div class="text-on-surface-variant font-body-md text-body-md">Lỗi vi phạm</div>
<div class="font-label-lg text-label-lg text-on-surface text-right">Sử dụng điện thoại<br/>trong giờ học</div>
</div>
<div class="flex justify-between items-start">
<div class="text-on-surface-variant font-body-md text-body-md">Thời gian</div>
<div class="font-label-lg text-label-lg text-on-surface">09:15, 24/10/2023</div>
</div>
</div>
</section>
<!-- Form Section -->
<section class="flex-1 flex flex-col gap-4">
<h2 class="font-title-lg text-title-lg text-on-surface">Biện pháp khắc phục</h2>
<div class="relative w-full">
<label class="absolute -top-2 left-3 bg-surface px-1 font-label-sm text-label-sm text-primary z-10" for="proposal">Đề xuất xử lý</label>
<textarea class="w-full bg-transparent border-2 border-primary rounded-lg p-4 pt-4 font-body-md text-body-md text-on-surface focus:outline-none focus:ring-0 focus:border-primary resize-none" id="proposal" placeholder="Nhập chi tiết đề xuất xử lý vi phạm..." rows="5">Tịch thu điện thoại đến cuối buổi học. Yêu cầu học sinh làm bản kiểm điểm có chữ ký phụ huynh.</textarea>
</div>
</section>
<!-- Submit Button -->
<div class="mt-auto pt-6 pb-8 w-full flex justify-end">
<button class="w-full md:w-auto bg-primary text-on-primary h-12 px-6 rounded-lg font-label-lg text-label-lg hover:bg-primary-container-high transition-colors active:scale-95 duration-200 flex items-center justify-center gap-2" onclick="showSnackbar()">
<span class="material-symbols-outlined" data-icon="send" style="font-variation-settings: 'FILL' 1;">send</span>
                Gửi đề xuất
            </button>
</div>
</main>
<!-- SnackBar -->
<div class="fixed bottom-margin-mobile left-1/2 -translate-x-1/2 w-[calc(100%-32px)] max-w-sm bg-inverse-surface text-inverse-on-surface rounded-lg p-4 flex items-center gap-3 shadow-lg transform translate-y-24 opacity-0 transition-all duration-300 z-50" id="snackbar">
<span class="material-symbols-outlined text-inverse-primary" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-body-md text-body-md flex-1">Gửi đề xuất thành công</span>
<button class="text-inverse-primary font-label-lg text-label-lg hover:opacity-80" onclick="hideSnackbar()">ĐÓNG</button>
</div>
<script>
        function showSnackbar() {
            const snackbar = document.getElementById('snackbar');
            snackbar.classList.remove('translate-y-24', 'opacity-0');
            snackbar.classList.add('translate-y-0', 'opacity-100');
            
            setTimeout(() => {
                hideSnackbar();
            }, 3000);
        }

        function hideSnackbar() {
            const snackbar = document.getElementById('snackbar');
            snackbar.classList.add('translate-y-24', 'opacity-0');
            snackbar.classList.remove('translate-y-0', 'opacity-100');
        }
    </script>
