<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Vi phạm quy trình</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-lowest": "#ffffff",
                        "on-error-container": "#93000a",
                        "inverse-primary": "#81d1f0",
                        "secondary-fixed": "#d3e4fe",
                        "surface-variant": "#e0e3e5",
                        "on-secondary-fixed": "#0b1c30",
                        "primary-fixed-dim": "#81d1f0",
                        "surface-container-highest": "#e0e3e5",
                        "on-primary-container": "#d3f1ff",
                        "surface-dim": "#d8dadc",
                        "on-error": "#ffffff",
                        "on-background": "#191c1e",
                        "surface-container": "#eceef0",
                        "on-surface-variant": "#3f484c",
                        "surface-container-low": "#f2f4f6",
                        "secondary": "#505f76",
                        "surface-tint": "#006781",
                        "tertiary-fixed": "#d8e5e2",
                        "tertiary-container": "#616d6b",
                        "on-secondary": "#ffffff",
                        "inverse-on-surface": "#eff1f3",
                        "surface": "#f7f9fb",
                        "secondary-fixed-dim": "#b7c8e1",
                        "on-secondary-fixed-variant": "#38485d",
                        "on-primary-fixed": "#001f29",
                        "outline-variant": "#bec8cd",
                        "on-primary-fixed-variant": "#004d62",
                        "surface-container-high": "#e6e8ea",
                        "primary-container": "#0e7490",
                        "outline": "#6f787d",
                        "on-tertiary-fixed": "#121e1c",
                        "error-container": "#ffdad6",
                        "surface-bright": "#f7f9fb",
                        "on-primary": "#ffffff",
                        "tertiary-fixed-dim": "#bcc9c6",
                        "error": "#ba1a1a",
                        "background": "#f7f9fb",
                        "on-tertiary": "#ffffff",
                        "inverse-surface": "#2d3133",
                        "on-secondary-container": "#54647a",
                        "tertiary": "#495553",
                        "primary": "#005a71",
                        "primary-fixed": "#b9eaff",
                        "on-tertiary-fixed-variant": "#3d4947",
                        "secondary-container": "#d0e1fb",
                        "on-tertiary-container": "#e2efec",
                        "on-surface": "#191c1e"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-tablet": "24px",
                        "base": "4px",
                        "md": "16px",
                        "margin-mobile": "16px",
                        "xl": "32px",
                        "xs": "4px",
                        "sm": "8px",
                        "lg": "24px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Be Vietnam Pro"],
                        "title-lg": ["Be Vietnam Pro"],
                        "label-lg": ["Be Vietnam Pro"],
                        "label-sm": ["Be Vietnam Pro"],
                        "headline-md": ["Be Vietnam Pro"],
                        "body-md": ["Be Vietnam Pro"],
                        "headline-lg-mobile": ["Be Vietnam Pro"],
                        "body-lg": ["Be Vietnam Pro"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "title-lg": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.1px", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["26px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            font-family: 'Be Vietnam Pro', sans-serif;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-surface dark:bg-surface-dim z-50">
<div class="flex items-center px-4 h-16 w-full max-w-7xl mx-auto">
<button aria-label="Back" class="p-2 -ml-2 rounded-full hover:bg-surface-container-high transition-colors active:opacity-80 text-on-surface">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h1 class="ml-2 font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim flex-1">Vi phạm quy trình</h1>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-7xl mx-auto px-4 md:px-6 py-6 pb-24">
<div class="bg-surface-container-lowest rounded-xl p-4 md:p-6 shadow-sm border border-surface-variant max-w-2xl mx-auto">
<form class="space-y-6">
<!-- Dropdown -->
<div>
<label class="block font-label-lg text-label-lg text-on-surface-variant mb-2" for="quy-trinh">Quy trình bị vi phạm <span class="text-error">*</span></label>
<div class="relative">
<select class="block w-full pl-4 pr-10 py-3 text-body-lg font-body-lg text-on-surface bg-transparent border border-outline rounded-lg appearance-none focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-colors" id="quy-trinh">
<option disabled="" selected="" value="">Chọn quy trình...</option>
<option value="luu-mau">Lưu mẫu thực phẩm</option>
<option value="ve-sinh">Vệ sinh bề mặt</option>
<option value="nhiet-do">Kiểm soát nhiệt độ kho</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-on-surface-variant">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
<!-- Textarea -->
<div>
<label class="block font-label-lg text-label-lg text-on-surface-variant mb-2" for="mo-ta">Mô tả chi tiết hành vi vi phạm <span class="text-error">*</span></label>
<textarea class="block w-full px-4 py-3 text-body-lg font-body-lg text-on-surface bg-transparent border border-outline rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-colors resize-none placeholder-on-surface-variant/50" id="mo-ta" placeholder="Nhập chi tiết về hành vi vi phạm, thời gian, địa điểm..." rows="4"></textarea>
</div>
<!-- Photo Upload -->
<div>
<label class="block font-label-lg text-label-lg text-on-surface-variant mb-2">Ảnh chụp bằng chứng</label>
<button class="w-full flex flex-col items-center justify-center py-8 px-4 border-2 border-dashed border-outline-variant rounded-xl bg-surface-container-low hover:bg-surface-container-high transition-colors group" type="button">
<div class="h-12 w-12 rounded-full bg-primary-container flex items-center justify-center mb-3 group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-on-primary-container" style="font-variation-settings: 'FILL' 1;">photo_camera</span>
</div>
<span class="font-label-lg text-label-lg text-primary mb-1">Chụp hoặc tải ảnh lên</span>
<span class="font-body-md text-body-md text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">my_location</span>
                            Tự động ghi nhận GPS &amp; Timestamp
                        </span>
</button>
<!-- Preview Area (Hidden by default) -->
<div class="hidden mt-4 grid grid-cols-2 gap-4">
<!-- Example thumbnail structure -->
</div>
</div>
</form>
</div>
</main>
<!-- Fixed Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full bg-surface border-t border-surface-variant p-4 md:px-6 z-40">
<div class="max-w-2xl mx-auto">
<button class="w-full h-12 bg-primary text-on-primary rounded-lg font-label-lg text-label-lg flex items-center justify-center hover:bg-primary/90 active:scale-[0.98] transition-all shadow-sm" type="button">
                Lưu biên bản
            </button>
</div>
</div>
</body></html>
