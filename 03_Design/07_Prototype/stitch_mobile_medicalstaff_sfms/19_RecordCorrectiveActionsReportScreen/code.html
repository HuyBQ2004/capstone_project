<!DOCTYPE html>

<html class="light" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Ghi nhận biện pháp khắc phục CAPA</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "surface-container-low": "#f2f4f6",

                        "on-primary-fixed-variant": "#004d62",
                        "inverse-on-surface": "#eff1f3",
                        "inverse-primary": "#81d1f0",
                        "tertiary-fixed-dim": "#bcc9c6",
                        "surface-variant": "#e0e3e5",
                        "surface": "#f7f9fb",
                        "on-error-container": "#93000a",
                        "surface-tint": "#006781",

                        "surface-dim": "#d8dadc",

                        "tertiary-container": "#616d6b",
                        "inverse-surface": "#2d3133",
                        "surface-container-high": "#e6e8ea",
                        "secondary": "#505f76",

                    },
                    "borderRadius": {

                    },
                    "spacing": {

                    },
                    "fontFamily": {
                        "body-md": ["Be Vietnam Pro"],

<style>
        body { font-family: 'Be Vietnam Pro', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background antialiased flex flex-col min-h-screen">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface-dim docked full-width top-0 bg-surface-container-low dark:bg-surface-container-lowest flat no shadows flex items-center justify-between px-md w-full h-14 sticky z-50">
<button class="text-on-surface-variant dark:text-outline-variant hover:bg-surface-variant dark:hover:bg-surface-container-highest transition-colors rounded-full p-2 flex items-center justify-center focus:outline-none focus:ring-2 focus:ring-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-title-lg text-title-lg text-primary dark:text-primary-fixed-dim">Biện pháp khắc phục CAPA</h1>
<button class="text-on-surface-variant dark:text-outline-variant hover:bg-surface-variant dark:hover:bg-surface-container-highest transition-colors rounded-full p-2 flex items-center justify-center focus:outline-none focus:ring-2 focus:ring-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">more_vert</span>
</button>
</header>
<!-- Main Content -->
<main class="flex-grow px-margin-mobile md:px-margin-tablet py-lg space-y-xl max-w-3xl mx-auto w-full pb-[100px]">
<form class="space-y-xl">
<!-- Section 1: Thông tin sự cố -->
<section class="bg-surface-container-lowest rounded-lg p-md shadow-sm border border-surface-variant">
<h2 class="font-title-lg text-title-lg text-on-surface mb-sm">Thông tin sự cố</h2>
<div class="flex items-center justify-between">
<div>
<p class="font-label-lg text-label-lg text-on-surface-variant">Mã sự cố</p>
<p class="font-body-lg text-body-lg text-on-surface">INC-2023-1024-01</p>
</div>
<div class="text-right">
<p class="font-label-lg text-label-lg text-on-surface-variant">Mức độ</p>
<span class="inline-flex items-center px-3 py-1 rounded-full font-label-sm text-label-sm bg-error-container text-on-error-container">
                            Cao
                        </span>
</div>
</div>
</section>
<!-- Section 2: Nội dung khắc phục -->
<section class="bg-surface-container-lowest rounded-lg p-md shadow-sm border border-surface-variant space-y-md">
<h2 class="font-title-lg text-title-lg text-on-surface">Nội dung khắc phục</h2>
<div class="flex flex-col space-y-sm">
<label class="font-label-lg text-label-lg text-on-surface-variant" for="capa_action">Biện pháp khắc phục cụ thể <span class="text-error">*</span></label>
<textarea class="w-full rounded-lg border-outline-variant bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:border-primary focus:ring-1 focus:ring-primary p-3 transition-colors resize-y" id="capa_action" placeholder="Nhập chi tiết các bước cần thực hiện để khắc phục sự cố này..." rows="5"></textarea>
</div>
</section>
<!-- Section 3 & 4: Thiết lập -->
<section class="grid grid-cols-1 md:grid-cols-2 gap-md">
<!-- Thiết lập thời hạn -->
<div class="bg-surface-container-lowest rounded-lg p-md shadow-sm border border-surface-variant space-y-sm">
<label class="font-label-lg text-label-lg text-on-surface-variant flex items-center gap-2" for="deadline">
<span class="material-symbols-outlined text-secondary" style="font-size: 20px;">schedule</span>
                        Hạn xử lý
                    </label>
<select class="w-full rounded-lg border-outline-variant bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:border-primary focus:ring-1 focus:ring-primary p-3 appearance-none" id="deadline">
<option selected="" value="12">12 giờ</option>
<option value="24">24 giờ</option>
<option value="48">48 giờ</option>
</select>
</div>
<!-- Đối tượng xử lý -->
<div class="bg-surface-container-lowest rounded-lg p-md shadow-sm border border-surface-variant space-y-sm">
<label class="font-label-lg text-label-lg text-on-surface-variant flex items-center gap-2" for="assignee">
<span class="material-symbols-outlined text-secondary" style="font-size: 20px;">group</span>
                        Đối tượng xử lý
                    </label>
<select class="w-full rounded-lg border-outline-variant bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:border-primary focus:ring-1 focus:ring-primary p-3 appearance-none" id="assignee">
<option value="catering">Đơn vị cung cấp suất ăn</option>
<option value="maintenance">Bộ phận bảo trì</option>
<option value="medical">Phòng y tế</option>
</select>
</div>
</section>
</form>
</main>
<!-- Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full bg-surface-container-lowest border-t border-surface-variant p-margin-mobile md:px-margin-tablet z-40 shadow-[0px_-4px_12px_rgba(14,116,144,0.05)]">
<div class="max-w-3xl mx-auto w-full">
<button class="w-full min-h-[48px] bg-primary-container text-on-primary rounded-lg font-label-lg text-label-lg hover:brightness-90 transition-all flex items-center justify-center gap-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">send</span>
                Giao việc khắc phục
            </button>
</div>
</div>
</body></html>
