<h1 class="font-h2 text-h2 text-on-surface text-center mb-2">Đăng nhập</h1>
<p class="font-body-sm text-body-sm text-secondary text-center">Đăng nhập để truy cập vào hệ thống sfms.</p>
</div>
<!-- Form Section -->
<form class="space-y-5" onsubmit="event.preventDefault();">
<!-- Email Input -->
<div class="space-y-1.5">
<label class="block font-label-md text-label-md text-on-surface-variant" for="email">
                    Tên đăng nhập / Email
                </label>
<div class="relative">
<input class="block w-full h-10 px-3 py-2 border border-outline-variant rounded-md shadow-sm focus:ring-2 focus:ring-primary-container focus:border-primary-container font-body-sm text-body-sm text-on-surface placeholder-outline-variant transition-colors bg-surface-container-lowest" id="email" placeholder="Nhập email của bạn" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-1.5">
<div class="flex items-center justify-between">
<label class="block font-label-md text-label-md text-on-surface-variant" for="password">
                        Mật khẩu
                    </label>
</div>
<div class="relative">
<input class="block w-full h-10 px-3 py-2 border border-outline-variant rounded-md shadow-sm focus:ring-2 focus:ring-primary-container focus:border-primary-container font-body-sm text-body-sm text-on-surface placeholder-outline-variant transition-colors bg-surface-container-lowest pr-10" id="password" placeholder="••••••••" type="password"/>
<button aria-label="Hiện/ẩn mật khẩu" class="absolute inset-y-0 right-0 px-3 flex items-center text-outline hover:text-on-surface-variant transition-colors cursor-pointer" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-[20px]" id="password-toggle-icon">visibility_off</span>
</button>
</div>
</div>
<!-- Submit Button -->
<div class="pt-2">
<button class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-md shadow-sm font-label-md text-label-md text-on-primary bg-primary-container hover:brightness-90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-container transition-all active:scale-[0.98]" type="submit">
                    Đăng nhập
                </button>
</div>
</form>
<!-- Links Section -->
<div class="mt-6 flex flex-col space-y-3 text-center">
<a class="font-label-sm text-label-sm text-primary hover:text-primary-container hover:underline transition-colors focus:outline-none focus:ring-2 focus:ring-offset-1 focus:ring-primary-container rounded" href="#forgot-password">
                Quên mật khẩu?
            </a>
<div class="flex items-center justify-center space-x-1 font-body-sm text-body-sm text-secondary">
<span>Chưa có tài khoản?</span>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-container hover:underline font-medium transition-colors focus:outline-none focus:ring-2 focus:ring-offset-1 focus:ring-primary-container rounded" href="#register">
                    Đăng ký tài khoản mới
                </a>
</div>
</div>
</div>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const icon = document.getElementById('password-toggle-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.textContent = 'visibility';
            } else {
                passwordInput.type = 'password';
                icon.textContent = 'visibility_off';
            }
        }
    </script>
</body></html>
