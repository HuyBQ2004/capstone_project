<!-- Overlay & Modal -->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm px-4">

<!-- Modal Header -->
<div class="px-6 py-4 border-b border-surface-container-high flex justify-between items-center bg-surface">
<h2 class="font-h3 text-h3 text-on-surface">Đổi mật khẩu</h2>
<button class="text-on-surface-variant hover:text-on-surface transition-colors rounded-full p-1 hover:bg-surface-container">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Modal Body -->
<div class="p-6 space-y-5 bg-background">
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface" for="current-password">Mật khẩu hiện tại</label>
<div class="relative">
<input class="w-full h-10 px-3 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all font-body-base text-body-base placeholder:text-outline" id="current-password" placeholder="Nhập mật khẩu hiện tại" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface">
<span class="material-symbols-outlined text-xl">visibility_off</span>
</button>
</div>
</div>
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface" for="new-password">Mật khẩu mới</label>
<div class="relative">
<input class="w-full h-10 px-3 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all font-body-base text-body-base placeholder:text-outline" id="new-password" placeholder="Nhập mật khẩu mới" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface">
<span class="material-symbols-outlined text-xl">visibility_off</span>
</button>
</div>
</div>
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface" for="confirm-password">Xác nhận mật khẩu mới</label>
<div class="relative">
<input class="w-full h-10 px-3 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all font-body-base text-body-base placeholder:text-outline" id="confirm-password" placeholder="Nhập lại mật khẩu mới" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface">
<span class="material-symbols-outlined text-xl">visibility_off</span>
</button>
</div>
</div>
</div>
<!-- Modal Footer -->
<div class="px-6 py-4 border-t border-surface-container-high bg-surface flex justify-end gap-3">
<button class="px-4 py-2 h-10 rounded-lg border border-primary text-primary font-label-md text-label-md hover:bg-primary-container hover:text-on-primary-container transition-colors focus:ring-2 focus:ring-offset-2 focus:ring-primary">
                    Hủy
                </button>
<button class="px-4 py-2 h-10 rounded-lg bg-primary text-on-primary font-label-md text-label-md hover:brightness-90 transition-all focus:ring-2 focus:ring-offset-2 focus:ring-primary shadow-sm" onclick="showToast()">
                    Lưu mật khẩu mới
                </button>
</div>
</div>
</div>
<!-- Toast Notification (Hidden by default, shown on success) -->
<div class="fixed top-4 right-4 z-[100] transform translate-x-[150%] transition-transform duration-300 ease-out flex items-center gap-3 bg-[#f0fdf4] border border-[#bbf7d0] text-[#166534] px-4 py-3 rounded-lg shadow-lg max-w-sm" id="toast">
<span class="material-symbols-outlined text-[#22c55e]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<div class="flex flex-col">
<span class="font-label-md text-label-md font-semibold">Thành công</span>
<span class="font-body-sm text-body-sm">Đổi mật khẩu thành công!</span>
</div>
<button class="ml-auto text-[#166534]/70 hover:text-[#166534]" onclick="hideToast()">
<span class="material-symbols-outlined text-sm">close</span>
</button>
</div>
<script>
        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.remove('translate-x-[150%]');
            toast.classList.add('translate-x-0');
            
            // Auto hide after 3 seconds
            setTimeout(() => {
                hideToast();
            }, 3000);
        }

        function hideToast() {
            const toast = document.getElementById('toast');
            toast.classList.remove('translate-x-0');
            toast.classList.add('translate-x-[150%]');
        }
    </script>
