<body class="bg-surface text-on-surface min-h-screen flex items-center justify-center p-4 antialiased">
<!-- Top App Bar (Hidden for Auth screens per instructions, but keeping it in DOM if needed later, just visually hidden) -->
<header class="hidden bg-transparent font-h3 text-h3 docked full-width top-0 bg-transparent flat no shadows absolute top-0 left-0 w-full flex justify-center py-8 z-50">
<div class="font-h3 text-h3 font-bold text-primary dark:text-primary-fixed">sfms</div>
</header>
<main class="w-full max-w-auth-card-width">
<!-- Centered Card Layout -->
<div class="bg-surface-container-lowest rounded-lg shadow-soft-2 p-6 sm:p-8 border border-outline-variant/30">
<!-- Header section with back button -->
<div class="flex items-center mb-6">
<button aria-label="Quay lại" class="inline-flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-container transition-colors text-secondary mr-2 group" type="button">
<span class="material-symbols-outlined text-2xl group-hover:-translate-x-1 transition-transform" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-h3 text-h3 text-on-surface">Quên mật khẩu</h1>
</div>
<!-- Instruction Text -->
<p class="font-body-sm text-body-sm text-secondary mb-8">
                Vui lòng nhập địa chỉ email đã đăng ký để nhận mã xác thực OTP.
            </p>
<!-- Form -->
<form action="verify-otp" class="space-y-6" method="GET">
<!-- Email Input Group -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface block" for="email">
                        Địa chỉ Email
                    </label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-secondary" data-icon="mail">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-2 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface font-body-base text-body-base focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors h-10 outline-none placeholder:text-outline" id="email" name="email" placeholder="Nhập email để nhận mã" required="" type="email"/>
</div>
</div>
<!-- Submit Button -->
<button class="w-full flex justify-center items-center h-10 px-4 py-2 bg-primary-container text-on-primary-container font-label-md text-label-md rounded-lg hover:brightness-90 active:scale-[0.98] transition-all shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-container" type="submit">
                    Gửi mã xác thực OTP
                </button>
</form>
</div>
</main>
