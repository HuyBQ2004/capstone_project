<input class="otp-input w-10 h-12 sm:w-12 sm:h-14 text-center font-h3 text-h3 rounded-lg border border-outline-variant bg-surface-container-lowest focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" disabled="" max="9" maxlength="1" min="0" required="" type="number"/>
<input class="otp-input w-10 h-12 sm:w-12 sm:h-14 text-center font-h3 text-h3 rounded-lg border border-outline-variant bg-surface-container-lowest focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" disabled="" max="9" maxlength="1" min="0" required="" type="number"/>
<input class="otp-input w-10 h-12 sm:w-12 sm:h-14 text-center font-h3 text-h3 rounded-lg border border-outline-variant bg-surface-container-lowest focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" disabled="" max="9" maxlength="1" min="0" required="" type="number"/>
<input class="otp-input w-10 h-12 sm:w-12 sm:h-14 text-center font-h3 text-h3 rounded-lg border border-outline-variant bg-surface-container-lowest focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" disabled="" max="9" maxlength="1" min="0" required="" type="number"/>

<span class="material-symbols-outlined text-[16px]" data-icon="schedule">schedule</span>
                Mã OTP hết hiệu lực sau <span class="font-bold text-on-surface" id="countdownDisplay">02:00</span>
</p>

<!-- Resend Link -->

                Không nhận được mã? 
                <button class="font-label-md text-label-md text-secondary opacity-50 cursor-not-allowed ml-1 transition-colors" disabled="" id="resendBtn">

                </button>

<script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('.otp-input');
            const form = document.getElementById('otpForm');
            
            // OTP Input Logic
            inputs.forEach((input, index) => {
                // Focus first input automatically
                if(index === 0) input.focus();

                input.addEventListener('input', (e) => {
                    const val = e.target.value;
                    // Ensure only one digit
                    if (val.length > 1) {
                        e.target.value = val.slice(0, 1);
                    }
                    
                    if (val && index < inputs.length - 1) {
                        inputs[index + 1].disabled = false;
                        inputs[index + 1].focus();
                    }
                });

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && !e.target.value && index > 0) {
                        inputs[index].disabled = true;
                        inputs[index - 1].focus();
                        inputs[index - 1].value = '';
                    }
                });
                
                // Allow paste
                input.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const pastedData = e.clipboardData.getData('text').slice(0, 6).replace(/\D/g, '');
                    if(pastedData) {
                        for(let i = 0; i < pastedData.length; i++) {
                            if(inputs[i]) {
                                inputs[i].disabled = false;
                                inputs[i].value = pastedData[i];
                                if(i < inputs.length - 1) inputs[i+1].focus();
                            }
                        }
                    }
                });
            });

            // Form Submit Logic
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                let otp = '';
                let isValid = true;
                inputs.forEach(input => {
                    if(!input.value) isValid = false;
                    otp += input.value;
                });
                
                if(isValid && otp.length === 6) {
                    // Simulate successful verification and redirect
                    const btn = form.querySelector('button[type="submit"]');
                    const originalText = btn.innerHTML;
                    btn.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span>';
                    btn.disabled = true;
                    
                    setTimeout(() => {
                        window.location.href = '#reset-password'; // Placeholder redirect
                        // Reset button for demo purposes
                        btn.innerHTML = originalText;
                        btn.disabled = false;
                    }, 1000);
                } else {
                    // Visual feedback for error
                    const container = document.getElementById('otpContainer');
                    container.classList.add('animate-bounce');
                    setTimeout(() => container.classList.remove('animate-bounce'), 500);
                }
            });

            // Countdown Logic
            const countdownDisplay = document.getElementById('countdownDisplay');
            const resendBtn = document.getElementById('resendBtn');
            let timeLeft = 120; // 2 minutes in seconds
            let timerId;

            function startTimer() {
                clearInterval(timerId);
                timeLeft = 120;
                resendBtn.disabled = true;
                resendBtn.classList.remove('text-primary', 'hover:underline', 'opacity-100', 'cursor-pointer');
                resendBtn.classList.add('text-secondary', 'opacity-50', 'cursor-not-allowed');
                
                timerId = setInterval(() => {
                    timeLeft--;
                    const minutes = Math.floor(timeLeft / 60);
                    const seconds = timeLeft % 60;
                    countdownDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

                    if (timeLeft <= 0) {
                        clearInterval(timerId);
                        countdownDisplay.textContent = "00:00";
                        resendBtn.disabled = false;
                        resendBtn.classList.remove('text-secondary', 'opacity-50', 'cursor-not-allowed');
                        resendBtn.classList.add('text-primary', 'hover:underline', 'opacity-100', 'cursor-pointer');
                    }
                }, 1000);
            }

            startTimer();

            // Resend Logic
            resendBtn.addEventListener('click', (e) => {
                if(!resendBtn.disabled) {
                    // Reset inputs
                    inputs.forEach((input, index) => {
                        input.value = '';
                        if(index > 0) input.disabled = true;
                    });
                    inputs[0].focus();
                    startTimer();
                }
            });
        });
    </script>
