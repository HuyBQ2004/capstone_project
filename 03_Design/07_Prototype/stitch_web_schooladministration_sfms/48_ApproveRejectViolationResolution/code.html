<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Xác nhận đóng vi phạm</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-fixed-variant": "#004d62",
                        "on-error-container": "#93000a",
                        "inverse-primary": "#81d1f0",
                        "surface-container-high": "#e2e7ff",
                        "surface": "#faf8ff",
                        "on-secondary-container": "#54647a",
                        "surface-tint": "#006781",
                        "secondary-container": "#d0e1fb",
                        "on-secondary-fixed": "#0b1c30",
                        "on-background": "#131b2e",
                        "primary": "#005a71",
                        "tertiary-fixed": "#dfe3e7",
                        "tertiary": "#4e5356",
                        "surface-container-highest": "#dae2fd",
                        "on-primary": "#ffffff",
                        "on-surface": "#131b2e",
                        "on-secondary": "#ffffff",
                        "inverse-surface": "#283044",
                        "surface-container-low": "#f2f3ff",
                        "secondary-fixed": "#d3e4fe",
                        "error-container": "#ffdad6",
                        "inverse-on-surface": "#eef0ff",
                        "on-surface-variant": "#3f484c",
                        "primary-container": "#0e7490",
                        "primary-fixed-dim": "#81d1f0",
                        "on-primary-container": "#d3f1ff",
                        "primary-fixed": "#b9eaff",
                        "surface-variant": "#dae2fd",
                        "surface-dim": "#d2d9f4",
                        "tertiary-container": "#666b6f",
                        "outline-variant": "#bec8cd",
                        "outline": "#6f787d",
                        "tertiary-fixed-dim": "#c3c7cb",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-fixed-variant": "#38485d",
                        "secondary": "#505f76",
                        "surface-container": "#eaedff",
                        "surface-bright": "#faf8ff",
                        "secondary-fixed-dim": "#b7c8e1",
                        "error": "#ba1a1a",
                        "on-tertiary-fixed": "#171c1f",
                        "on-primary-fixed": "#001f29",
                        "on-tertiary-fixed-variant": "#43474b",
                        "on-tertiary": "#ffffff",
                        "background": "#faf8ff",
                        "on-tertiary-container": "#e8edf1",
                        "on-error": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "element-gap": "0.5rem",
                        "container-padding": "2rem",
                        "gutter": "1rem",
                        "section-gap": "1.5rem"
                    },
                    "fontFamily": {
                        "body-sm": ["Be Vietnam Pro"],
                        "label-sm": ["Be Vietnam Pro"],
                        "h2": ["Be Vietnam Pro"],
                        "body-base": ["Be Vietnam Pro"],
                        "label-md": ["Be Vietnam Pro"],
                        "h1-mobile": ["Be Vietnam Pro"],
                        "h3": ["Be Vietnam Pro"],
                        "h1": ["Be Vietnam Pro"]
                    },
                    "fontSize": {
                        "body-sm": ["13px", { "lineHeight": "18px", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "h2": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "body-base": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "h1-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "h3": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "h1": ["30px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Be Vietnam Pro', sans-serif; }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen relative overflow-hidden flex items-center justify-center">
<!-- Mock Background Content (Blurred) -->
<div class="absolute inset-0 z-0 bg-surface-container-low p-8 opacity-50 blur-sm flex flex-col gap-6">
<div class="w-full max-w-5xl mx-auto flex flex-col gap-6">
<div class="h-10 w-64 bg-surface-variant rounded"></div>
<div class="h-64 w-full bg-surface-container rounded-lg border border-outline-variant"></div>
<div class="h-96 w-full bg-surface-container rounded-lg border border-outline-variant"></div>
</div>
</div>
<!-- Backdrop Overlay -->
<div class="absolute inset-0 z-40 bg-[#0f172a]/40 backdrop-blur-[2px] flex items-center justify-center p-4">
<!-- Modal Dialog -->
<div class="bg-surface rounded-xl shadow-lg w-full max-w-lg overflow-hidden border border-outline-variant flex flex-col animate-in fade-in zoom-in-95 duration-200">
<!-- Modal Header -->
<div class="px-6 py-5 border-b border-outline-variant flex items-center justify-between bg-surface">
<h2 class="font-h3 text-h3 text-on-surface">Xác nhận đóng vi phạm</h2>
<button aria-label="Close dialog" class="text-on-surface-variant hover:text-on-surface transition-colors focus:outline-none focus:ring-2 focus:ring-primary rounded-full p-1" type="button">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
<!-- Modal Body -->
<div class="px-6 py-6 flex flex-col gap-6 bg-surface overflow-y-auto max-h-[716px]">
<!-- Textarea Field -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface flex items-center gap-1" for="resolution_notes">
                        Ghi chú nghiệm thu <span class="text-error">*</span>
</label>
<textarea class="w-full font-body-base text-body-base text-on-surface bg-surface border border-outline-variant rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary transition-all resize-none placeholder:text-on-surface-variant/50" id="resolution_notes" name="resolution_notes" placeholder="Nhập chi tiết quá trình nghiệm thu..." required="" rows="4">Đã kiểm tra lại tủ lạnh số 03 sau khi sửa chữa. Nhiệt độ đo được ổn định ở mức 2°C trong 4 tiếng liên tục. Đủ điều kiện sử dụng lại.</textarea>
</div>
<!-- Upload Area -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface">
                        Đính kèm minh chứng
                    </label>
<!-- Drag & Drop Zone -->
<div class="border-2 border-dashed border-outline-variant rounded-lg p-6 flex flex-col items-center justify-center gap-3 bg-surface-container-low hover:bg-surface-container transition-colors cursor-pointer group">
<div class="w-10 h-10 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors">
<span class="material-symbols-outlined">cloud_upload</span>
</div>
<div class="text-center">
<p class="font-body-base text-body-base text-on-surface">
                                Kéo thả file vào đây hoặc <span class="text-primary font-medium hover:underline">Chọn tệp</span>
</p>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1">
                                Hỗ trợ: JPG, PNG, PDF (Tối đa 10MB)
                            </p>
</div>
</div>
<!-- Uploaded File List -->
<div class="flex flex-col gap-2 mt-2">
<div class="flex items-center justify-between p-3 rounded-lg border border-outline-variant bg-surface-container-lowest">
<div class="flex items-center gap-3 overflow-hidden">
<span class="material-symbols-outlined text-error" style="font-variation-settings: 'FILL' 1;">picture_as_pdf</span>
<div class="flex flex-col min-w-0">
<span class="font-label-md text-label-md text-on-surface truncate">Bien_ban_nghiem_thu_lanh.pdf</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">2.4 MB</span>
</div>
</div>
<button class="text-on-surface-variant hover:text-error transition-colors p-1 rounded-full hover:bg-error-container/50" type="button">
<span class="material-symbols-outlined text-[20px]">delete</span>
</button>
</div>
</div>
</div>
</div>
<!-- Modal Footer -->
<div class="px-6 py-4 border-t border-outline-variant bg-surface-container-lowest flex items-center justify-end gap-3">
<button class="px-4 py-2 rounded-lg font-label-md text-label-md bg-surface border border-outline-variant text-on-surface hover:bg-surface-container transition-colors focus:outline-none focus:ring-2 focus:ring-primary/30" type="button">
                    Hủy
                </button>
<button class="px-4 py-2 rounded-lg font-label-md text-label-md bg-primary-container text-on-primary-container hover:brightness-95 transition-all focus:outline-none focus:ring-2 focus:ring-primary/30 flex items-center gap-2" type="button">
<span class="material-symbols-outlined text-[18px]">check_circle</span>
                    Xác nhận đóng vi phạm
                </button>
</div>
</div>
</div>
</body></html>
