                    Thông tin sẽ được gửi trực tiếp đến Ban quản lý An toàn Thực phẩm và Ban Giám hiệu nhà trường.

<!-- Bottom Navigation (Shared Component Logic - Filtered for focused task) -->
<!-- Navigation suppressed per 'Semantic Shell Mandate' for task-focused/transactional screens -->
<script>
        // Micro-interaction for form submission
        document.querySelector('form').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = `<span class="material-symbols-outlined animate-spin">sync</span> Đang gửi...`;
            
            setTimeout(() => {
                btn.classList.replace('bg-error', 'bg-secondary');
                btn.innerHTML = `<span class="material-symbols-outlined">check_circle</span> Đã gửi thành công`;
                
                setTimeout(() => {
                    // In a real app, this would navigate back
                    alert('Báo cáo của bạn đã được tiếp nhận. Đội ngũ an toàn thực phẩm sẽ kiểm tra ngay lập tức.');
                    btn.disabled = false;
                    btn.classList.replace('bg-secondary', 'bg-error');
                    btn.innerHTML = originalContent;
                }, 1000);
            }, 1500);
        });

        // Severity selection color shifting for visual feedback
        const severityInputs = document.querySelectorAll('input[name="severity"]');
        severityInputs.forEach(input => {
            input.addEventListener('change', (e) => {
                const banner = document.querySelector('section.bg-error');
                if(e.target.value === 'high') {
                    banner.classList.add('animate-pulse');
                } else {
                    banner.classList.remove('animate-pulse');
                }
            });
        });
    </script>
