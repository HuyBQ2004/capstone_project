spring:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC

  flyway:
    enabled: true
    # V1 + V2 (prod) rồi V900 (fixture SYNTHETIC, chỉ có trên test classpath)
    locations: classpath:db/migration,classpath:db/testseed
    clean-disabled: false     # ⚠️ CHỈ container ephemeral của Testcontainers (TestSpec §7)

  mail:
    host: localhost
    port: 3025                # GreenMail
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id                 # FX-ENV-OAUTH
            client-secret: test-secret-32chars
            scope: [openid, email, profile]
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        # WireMock ghi đè provider để KHÔNG gọi Google thật (FX-WIREMOCK-GOOGLE).
        # Giá trị thật do GoogleOAuth2IT nạp động qua @DynamicPropertySource.
        provider:
          google:
            authorization-uri: http://localhost:0/o/oauth2/v2/auth
            token-uri: http://localhost:0/token
            user-info-uri: http://localhost:0/userinfo
            jwk-set-uri: http://localhost:0/jwks
            user-name-attribute: sub

sfms:
  jwt:
    secret: test-secret-key-for-junit-only-at-least-32-bytes-long-0123456789
    issuer: sfms
  refresh-token:
    sliding-days: 14
  activation-token:
    hours: 48
  reset-token:
    minutes: 60
    request-window-minutes: 15
  profile-photo:
    max-bytes: 10485760
    allowed-types: application/pdf,image/jpeg,image/png

logging:
  level:
    root: WARN
    com.sfms: INFO
    org.testcontainers: WARN
    org.flywaydb: WARN
